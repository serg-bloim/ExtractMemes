name: Check for new video

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-and-run:
    runs-on: ubuntu-latest
    env:
      EXTRACT_MEMES_PROXY: ${{ secrets.YT_DLP_PROXY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out the data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install yt-dlp and the local package, without its heavy dependencies
        run: |
          pip install yt-dlp
          pip install --no-deps -e .

      - name: Find the oldest unprocessed video
        id: find
        env:
          LOOKBACK_COUNT: ${{ vars.LOOKBACK_COUNT }}
        run: |
          count_args=()
          if [ -n "$LOOKBACK_COUNT" ]; then
            count_args=(--count "$LOOKBACK_COUNT")
          fi
          video_id=$(python -m extract_memes.playlist_watch find --playlist-url "${{ vars.PLAYLIST_URL }}" --processed-file data-branch/processed_vids.txt "${count_args[@]}")
          echo "video_id=$video_id" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.find.outputs.video_id != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the rest of ExtractMemes' dependencies
        if: steps.find.outputs.video_id != ''
        run: pip install -e .

      - name: Run the pipeline on the new video
        if: steps.find.outputs.video_id != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          SAVE_IMAGES: ${{ vars.SAVE_IMAGES }}
        run: |
          save_args=()
          if [ "$SAVE_IMAGES" = "true" ]; then
            save_args=(--save-low-res --save-high-res)
          fi
          extract-memes "https://youtu.be/${{ steps.find.outputs.video_id }}" \
            --classifier heuristic \
            --upload-to telegram \
            --run-name "${{ steps.find.outputs.video_id }}" \
            "${save_args[@]}"

      - name: Copy the meme images into the data branch
        if: steps.find.outputs.video_id != '' && vars.SAVE_IMAGES == 'true'
        run: |
          video_id="${{ steps.find.outputs.video_id }}"
          run_dir=".runtime/$video_id"
          mkdir -p "data-branch/$video_id"
          if [ -d "$run_dir/low-res" ]; then
            cp -r "$run_dir/low-res" "data-branch/$video_id/lowres"
          fi
          if [ -d "$run_dir/high-res" ]; then
            cp -r "$run_dir/high-res" "data-branch/$video_id/highres"
          fi

      - name: Mark the video as processed
        if: steps.find.outputs.video_id != ''
        run: python -m extract_memes.playlist_watch mark-processed "${{ steps.find.outputs.video_id }}" --processed-file data-branch/processed_vids.txt

      - name: Commit and push the updated data branch
        if: steps.find.outputs.video_id != ''
        working-directory: data-branch
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Mark ${{ steps.find.outputs.video_id }} as processed"
            git push
          fi
