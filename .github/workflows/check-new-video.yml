name: Check for new video

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */2 * * *"

concurrency:
  group: check-new-video
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-and-run:
    runs-on: ubuntu-latest
    env:
      EXTRACT_MEMES_PROXY: ${{ secrets.YT_DLP_PROXY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out the data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install yt-dlp and the local package, without its heavy dependencies
        run: |
          pip install yt-dlp
          pip install --no-deps -e .

      - name: Find the oldest unprocessed video
        id: find
        env:
          SINCE: ${{ vars.SINCE }}
        run: |
          since_args=()
          if [ -n "$SINCE" ]; then
            since_args=(--since "$SINCE")
          fi
          video_id=$(python -m extract_memes.playlist_watch find --playlist-url "${{ vars.PLAYLIST_URL }}" --processed-file data-branch/processed_vids.txt --dates-cache data-branch/upload_dates.json "${since_args[@]}")
          echo "video_id=$video_id" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.find.outputs.video_id != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the rest of ExtractMemes' dependencies
        if: steps.find.outputs.video_id != ''
        run: pip install -e .

      - name: Run the pipeline on the new video
        if: steps.find.outputs.video_id != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          SAVE_LOW_RES: ${{ vars.SAVE_LOW_RES }}
          SAVE_HIGH_RES: ${{ vars.SAVE_HIGH_RES }}
          SAVE_FRAMES: ${{ vars.SAVE_FRAMES }}
        run: |
          save_args=()
          if [ "$SAVE_LOW_RES" = "true" ]; then
            save_args+=(--save-low-res)
          fi
          if [ "$SAVE_HIGH_RES" = "true" ]; then
            save_args+=(--save-high-res)
          fi
          if [ "$SAVE_FRAMES" = "true" ]; then
            save_args+=(--save-frames)
          fi
          url="https://youtu.be/${{ steps.find.outputs.video_id }}"
          echo "Video URL: $url"
          extract-memes "$url" \
            --classifier heuristic \
            --upload-to telegram \
            --run-name "${{ steps.find.outputs.video_id }}" \
            --runtime-dir data-branch/runs \
            "${save_args[@]}"

      - name: Drop the clean images from the data branch unless asked to keep them
        if: steps.find.outputs.video_id != '' && vars.SAVE_CLEAN != 'true'
        run: rm -rf "data-branch/runs/${{ steps.find.outputs.video_id }}/clean"

      - name: Mark the video as processed
        if: steps.find.outputs.video_id != ''
        run: python -m extract_memes.playlist_watch mark-processed "${{ steps.find.outputs.video_id }}" --processed-file data-branch/processed_vids.txt

      - name: Commit and push the updated data branch
        if: always()
        working-directory: data-branch
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            video_id="${{ steps.find.outputs.video_id }}"
            if [ -n "$video_id" ]; then
              message="Update data for $video_id"
            else
              message="Update data"
            fi
            git commit -m "$message"
            git push
          fi
