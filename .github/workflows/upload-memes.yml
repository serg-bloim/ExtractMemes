name: Upload extracted memes

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: upload-memes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      EXTRACT_MEMES_PROXY: ${{ secrets.YT_DLP_PROXY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out the data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch
          sparse-checkout: |
            /processed_vids.txt
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install what the upload needs
        run: |
          pip install yt-dlp tqdm requests opencv-python-headless numpy
          pip install --no-deps -e .

      - name: Pick up to 5 extracted videos to upload and fetch their images
        id: pending
        run: |
          ids=$(python -m extract_memes.playlist_watch pending --limit 5 --processed-file data-branch/processed_vids.txt)
          echo "ids=$(echo $ids)" >> "$GITHUB_OUTPUT"
          for id in $ids; do
            git -C data-branch sparse-checkout add "/runs/$id/clean/"
          done

      - name: Upload the memes of up to 5 extracted videos to Telegram
        if: steps.pending.outputs.ids != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          VIDEO_IDS: ${{ steps.pending.outputs.ids }}
        run: |
          python -m extract_memes.upload_pending $VIDEO_IDS \
            --runs-dir data-branch/runs \
            --done-file "$RUNNER_TEMP/uploaded.txt"

      - name: Mark the uploaded videos in the data branch
        if: always() && steps.pending.outputs.ids != ''
        run: .github/scripts/push-data.sh "Mark videos as uploaded" uploaded "$RUNNER_TEMP/uploaded.txt"
