[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "extract-memes"
version = "0.1.0"
description = "Extract meme images from YouTube videos known to contain them."
requires-python = ">=3.14"
dependencies = [
    "yt-dlp",
    "static-ffmpeg",
    "opencv-python-headless",
    "numpy",
    "tqdm",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest"]
# Development tooling only (tools/labeling); the Dockerfile and the GitHub workflow install without it.
labeling = ["PyYAML", "Flask"]

[project.scripts]
extract-memes = "extract_memes.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# A bare `pytest` only collects tests/; playground/ files still run when given explicitly (IDE run icon).
testpaths = ["tests"]
# Lets tests import the development tools under tools/ (they are not part of the installed package).
pythonpath = ["."]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
