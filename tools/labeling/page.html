<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frame Labeler</title>
<style>
  :root { --bg:#16181d; --panel:#1e2128; --line:#2f333d; --text:#e4e6eb; --dim:#8b909c;
          --mark:#ffc933; --flag:#ff6b6b; --ok:#5dd39e; --sel:#3b82f6; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.4 system-ui, sans-serif;
         display:grid; grid-template-columns: 330px 1fr; height:100vh; overflow:hidden; }
  #side { display:flex; flex-direction:column; border-right:1px solid var(--line); min-height:0; }
  #filters { padding:8px; border-bottom:1px solid var(--line); background:var(--panel); font-size:12px; }
  #filters .row { display:flex; gap:6px; align-items:center; margin-bottom:5px; flex-wrap:wrap; }
  #filters label { color:var(--dim); min-width:78px; }
  #filters input[type=number] { width:62px; }
  select, input, button { background:var(--bg); color:var(--text); border:1px solid var(--line);
         border-radius:4px; padding:2px 5px; font:inherit; }
  button { cursor:pointer; } button:hover { border-color:var(--dim); }
  #count { color:var(--dim); padding:4px 8px; border-bottom:1px solid var(--line); }
  #strip { flex:1; overflow-y:scroll; position:relative; min-height:0; }
  #spacer { position:relative; }
  .row-item { position:absolute; left:0; right:0; height:68px; display:flex; gap:8px; padding:4px 8px;
         border-bottom:1px solid var(--line); cursor:pointer; align-items:center; }
  .row-item:hover { background:#242832; }
  .row-item.sel { background:#1f3556; outline:1px solid var(--sel); }
  .row-item.multi { background:#2a3f66; }
  #strip { user-select:none; }
  .row-item img { width:96px; height:54px; object-fit:cover; background:#000; flex:none; }
  .row-item .meta { font-size:11px; line-height:1.35; min-width:0; }
  .row-item .ts { font-weight:600; }
  .star { color:var(--mark); font-weight:700; }
  .flag { color:var(--flag); font-weight:700; }
  .no { color:#7fb2ff; font-weight:700; }
  .chip.neg { border-color:#37507a; }
  #view.notmeme { border-color:#7fb2ff; box-shadow:0 0 0 2px #7fb2ff; }
  .dim { color:var(--dim); }
  #main { display:flex; flex-direction:column; min-width:0; min-height:0; padding:10px; gap:8px; }
  #view { flex:1; min-height:0; display:flex; justify-content:center; align-items:center; background:#000;
          border:1px solid var(--line); position:relative; }
  #view.marked { border-color:var(--mark); box-shadow:0 0 0 2px var(--mark); }
  #big { max-width:100%; max-height:100%; image-rendering:auto; }
  #info { display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start; }
  #info table { border-collapse:collapse; } #info td { padding:1px 10px 1px 0; }
  #marks { max-height:120px; overflow:auto; display:flex; gap:6px; flex-wrap:wrap; }
  .chip { border:1px solid var(--line); border-radius:12px; padding:1px 4px 1px 9px; cursor:pointer; background:var(--panel); }
  .chip.cur { border-color:var(--mark); }
  .chip b { margin-left:5px; color:var(--dim); cursor:pointer; padding:0 3px; } .chip b:hover { color:var(--flag); }
  #help { color:var(--dim); font-size:12px; }
  kbd { background:var(--panel); border:1px solid var(--line); border-radius:3px; padding:0 4px; }
  #err { color:var(--flag); }
  #bar { display:flex; gap:8px; align-items:center; padding:8px; border-bottom:1px solid var(--line); }
  #vid a { color:inherit; text-decoration:none; } #vid a:hover { text-decoration:underline; color:var(--sel); }
  #vid { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  #opener { position:fixed; inset:0; background:rgba(0,0,0,.65); display:flex; align-items:center; justify-content:center; z-index:10; }
  #opener[hidden] { display:none; }
  #opener .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; width:min(560px, 92vw); }
  #opener h3 { margin:0 0 10px; }
  #opener .row { display:flex; gap:6px; margin-bottom:10px; } #opener input { flex:1; padding:5px 8px; }
  #opener select { flex:1; padding:5px 8px; }
  #open-bar { width:100%; } #open-msg, #lookup-msg { min-height:1.4em; }
  #opener .card { display:flex; gap:12px; margin-bottom:10px; } #opener .card img { width:160px; height:90px; object-fit:cover; background:#000; flex:none; }
  #opener .title { font-weight:600; font-size:14px; margin-bottom:3px; }
  #fmt-list { max-height:220px; overflow:auto; margin-bottom:10px; border:1px solid var(--line); border-radius:4px; }
  #fmt-list label { display:flex; gap:10px; padding:4px 8px; cursor:pointer; align-items:center; }
  #fmt-list label:hover { background:#242832; } #fmt-list label.off { opacity:.45; cursor:default; }
  .warn { color:var(--mark); }
</style>
</head>
<body>
<div id="side">
  <div id="bar"><span id="vid">no video</span><button id="open-btn">Open video…</button></div>
  <div id="filters">
    <div class="row"><label>Human label</label>
      <select id="f-human"><option value="">any</option><option value="meme">meme</option><option value="not_meme">not a meme</option><option value="none">unlabeled</option><option value="other">anything but meme</option></select></div>
    <div class="row"><label>Classifier</label>
      <select id="f-verdict"><option value="">any</option><option value="1">flagged</option><option value="0">not flagged</option></select></div>
    <div id="f-criteria"></div>
    <div class="row">
      <button id="fp" title="Flagged by the classifier but not marked as a meme by me (unlabeled or not a meme)">False positives</button>
      <button id="miss" title="Marked by me but not flagged by the classifier">Misses</button>
      <button id="reset">Reset</button></div>
  </div>
  <div id="count"></div>
  <div id="strip"><div id="spacer"></div></div>
</div>
<div id="main">
  <div id="view"><img id="big" alt=""><div id="none" class="dim" hidden>No frame selected</div></div>
  <div id="info">
    <table id="facts"></table>
    <div>
      <div><button id="toggle">Mark as meme (M)</button> <button id="toggle-not">Mark as not a meme (X)</button> <span id="err"></span></div>
      <div id="help">
        <kbd>←</kbd><kbd>→</kbd> frame · <kbd>Shift</kbd>+arrows 1 s · <kbd>Shift</kbd>/<kbd>⌘</kbd>+click rows to select several (<kbd>Esc</kbd> clears) · <kbd>↑</kbd><kbd>↓</kbd> row in strip ·
        <kbd>M</kbd> meme · <kbd>X</kbd> not a meme · <kbd>Shift</kbd>+<kbd>M</kbd> move the nearest mark here · <kbd>N</kbd>/<kbd>P</kbd> next/prev mark · <kbd>U</kbd> next unlabeled stretch ·
        <kbd>J</kbd>/<kbd>K</kbd> next/prev in filter · <kbd>G</kbd> jump to time
      </div>
    </div>
    <div><input id="goto" placeholder="jump to time (s or m:s)" size="20"></div>
  </div>
  <div id="marks"></div>
</div>
<div id="opener" hidden>
  <div class="panel">
    <h3>Open a video</h3>
    <div class="row"><input id="src" placeholder="Paste a YouTube URL or video id" autocomplete="off">
      <button id="src-go">Look up</button><button id="src-close">Close</button></div>
    <div id="ds-row" class="row" hidden><select id="vid-select" title="Videos that already have labels"></select></div>
    <div id="lookup-msg"></div>
    <div id="card" hidden>
      <div class="card"><img id="th" alt="">
        <div><div id="ti" class="title"></div><div id="meta" class="dim"></div><div id="dsnote"></div></div></div>
      <div id="fmt-list"></div>
      <div class="row"><button id="load">Load selected format</button></div>
    </div>
    <div id="open-msg"></div>
    <progress id="open-bar" max="1" hidden></progress>
  </div>
</div>
<script>
"use strict";
const ROW_H = 68;
let S;                       // server state
let sel = 0;                 // selected native frame index
let view = [];               // strip row numbers (into S.rows) that match the filters
let memeFrames = new Set();
let notFrames = new Set();
let rowMarked = [];          // per strip row: is there a meme mark mapped to it
let rowNot = [];             // per strip row: is there a not-a-meme mark mapped to it
let loadToken = 0;
let hasSel = true;           // false after Esc: no frame is selected (`sel` is only where the arrows resume)
let multi = new Set();       // strip rows selected with shift/cmd+click
let anchorRow = 0;           // where a shift+click range starts

const $ = id => document.getElementById(id);
const fmt = t => { const m = Math.floor(t / 60), s = t - m * 60; return m + ":" + s.toFixed(3).padStart(6, "0"); };

async function api(path, body) {
  const res = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"},
                                        body: JSON.stringify(body)} : undefined);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.status);
  return data;
}

// The strip row a native frame belongs to: the last scanned frame at or before it.
const rowOf = frame => Math.min(S.rows.length - 1, Math.floor(frame / S.step));

function applyLabels(labels) {
  S.memes = labels.memes;
  S.not_memes = labels.not_memes || [];
  memeFrames = new Set(S.memes.map(m => m.frame));
  notFrames = new Set(S.not_memes.map(m => m.frame));
  rowMarked = new Array(S.rows.length).fill(false);
  rowNot = new Array(S.rows.length).fill(false);
  for (const m of S.memes) rowMarked[rowOf(m.frame)] = true;
  for (const m of S.not_memes) rowNot[rowOf(m.frame)] = true;
}

const humanLabel = r => rowMarked[r] ? "meme" : rowNot[r] ? "not_meme" : "none";

function filters() {
  const f = {human: $("f-human").value, verdict: $("f-verdict").value, ranges: {}};
  for (const c of S.criteria) {
    const lo = $("min-" + c.name).value, hi = $("max-" + c.name).value;
    if (lo !== "" || hi !== "") f.ranges[c.name] = [lo === "" ? -Infinity : +lo, hi === "" ? Infinity : +hi];
  }
  return f;
}

function matches(row, f) {
  if (f.human === "other" ? humanLabel(row) === "meme" : f.human !== "" && humanLabel(row) !== f.human) return false;
  if (f.verdict !== "" && String(S.verdict[row]) !== f.verdict) return false;
  for (const [name, [lo, hi]] of Object.entries(f.ranges)) {
    const v = S.scores[name][row];
    if (v < lo || v > hi) return false;
  }
  return true;
}

function refilter() {
  const f = filters();
  view = [];
  for (let r = 0; r < S.rows.length; r++) if (matches(r, f)) view.push(r);
  $("count").textContent = view.length + " of " + S.rows.length + " scanned frames shown · " +
                           S.memes.length + " marked";
  $("spacer").style.height = view.length * ROW_H + "px";
  renderStrip();
}

function renderStrip() {
  const strip = $("strip"), spacer = $("spacer");
  const first = Math.max(0, Math.floor(strip.scrollTop / ROW_H) - 3);
  const last = Math.min(view.length, Math.ceil((strip.scrollTop + strip.clientHeight) / ROW_H) + 3);
  const selRow = hasSel ? rowOf(sel) : -1;
  const frag = document.createDocumentFragment();
  for (let i = first; i < last; i++) {
    const r = view[i], idx = S.rows[r];
    const el = document.createElement("div");
    el.className = "row-item" + (r === selRow ? " sel" : "") + (multi.has(r) ? " multi" : "");
    el.style.top = i * ROW_H + "px";
    const scores = S.criteria.map(c => c.name.slice(0, 6) + " " + S.scores[c.name][r]).join(" · ");
    el.innerHTML = '<img loading="lazy" src="/thumb/' + idx + '.jpg">' +
      '<div class="meta"><div><span class="ts">' + fmt(S.pts[idx]) + '</span> <span class="dim">#' + idx + '</span> ' +
      (rowMarked[r] ? '<span class="star">★ meme</span> ' : '') +
      (rowNot[r] ? '<span class="no">✗ not meme</span> ' : '') +
      (S.verdict[r] ? '<span class="flag">⚑ flagged</span>' : '') + '</div>' +
      '<div class="dim">' + scores + '</div></div>';
    el.onclick = e => clickRow(r, i, e);
    frag.appendChild(el);
  }
  spacer.replaceChildren(frag);
}

function scrollToSelection() {
  const i = view.indexOf(rowOf(sel));
  if (i < 0) return;
  const strip = $("strip");
  if (i * ROW_H < strip.scrollTop || (i + 1) * ROW_H > strip.scrollTop + strip.clientHeight)
    strip.scrollTop = Math.max(0, i * ROW_H - strip.clientHeight / 2);
}

function clickRow(r, i, e) {
  if (e.shiftKey) {                                   // range over the rows currently shown
    const a = Math.max(0, view.indexOf(anchorRow));
    const [lo, hi] = a <= i ? [a, i] : [i, a];
    multi = new Set(view.slice(lo, hi + 1));
    select(S.rows[r], false, true);
  } else if (e.metaKey || e.ctrlKey) {
    multi = new Set(multi.size ? multi : [rowOf(sel)]);
    multi.has(r) ? multi.delete(r) : multi.add(r);
    anchorRow = r;
    select(S.rows[r], false, true);
  } else {
    anchorRow = r;
    select(S.rows[r], false);
  }
}

function select(frame, scroll = true, keepMulti = false) {
  if (!keepMulti) multi = new Set();
  hasSel = true;
  sel = Math.max(0, Math.min(S.frame_count - 1, frame));
  const token = ++loadToken;
  const img = new Image();
  img.onload = () => { if (token === loadToken) $("big").src = img.src; };
  img.onerror = () => { if (token === loadToken) $("err").textContent = "could not load frame " + sel; };
  img.src = "/frame/" + sel + ".jpg";
  for (const d of [1, 2, 3, -1, -2]) {              // warm the neighbours so stepping feels instant
    const n = sel + d;
    if (n >= 0 && n < S.frame_count) new Image().src = "/frame/" + n + ".jpg";
  }
  $("err").textContent = "";
  renderInfo();
  if (scroll) scrollToSelection();
  renderStrip();
}

function deselectAll() {
  multi = new Set();
  hasSel = false;
  loadToken++;                                       // drop a frame that is still loading
  $("big").removeAttribute("src");
  renderInfo();
  renderStrip();
}

function renderChips() {
  const chip = (m, label) => {
    const el = document.createElement("span");
    el.className = "chip" + (label === "not_meme" ? " neg" : "") + (hasSel && m.frame === sel ? " cur" : "");
    el.textContent = (label === "not_meme" ? "✗ " : "") + fmt(m.ts) + " #" + m.frame;
    el.onclick = () => select(m.frame);
    const x = document.createElement("b"); x.textContent = "✕"; x.title = "remove this label";
    x.onclick = e => { e.stopPropagation(); setMark(m.frame, false, label); };
    el.appendChild(x);
    return el;
  };
  $("marks").replaceChildren(...S.memes.map(m => chip(m, "meme")), ...S.not_memes.map(m => chip(m, "not_meme")));
}

function renderInfo() {
  $("big").hidden = !hasSel;
  $("none").hidden = hasSel;
  $("toggle").disabled = $("toggle-not").disabled = !hasSel;
  if (!hasSel) {
    $("view").classList.remove("marked", "notmeme");
    $("toggle").textContent = "Mark as meme (M)";
    $("toggle-not").textContent = "Mark as not a meme (X)";
    $("facts").innerHTML = "<tr><td class='dim'>No frame selected</td></tr>";
    renderChips();
    return;
  }
  const r = rowOf(sel), onRow = S.rows[r] === sel;
  const marked = memeFrames.has(sel);
  const notMarked = notFrames.has(sel);
  $("view").classList.toggle("marked", marked);
  $("view").classList.toggle("notmeme", notMarked);
  const many = multi.size > 1;
  $("toggle").textContent = many
    ? (Array.from(multi).every(x => rowMarked[x]) ? "Unmark " : "Mark ") + multi.size + " selected as meme (M)"
    : (marked ? "Unmark meme" : "Mark as meme") + " (M)";
  $("toggle-not").textContent = many
    ? (Array.from(multi).every(x => rowNot[x]) ? "Unmark " : "Mark ") + multi.size + " selected as not a meme (X)"
    : (notMarked ? "Unmark not-a-meme" : "Mark as not a meme") + " (X)";
  let html = "<tr><td class='dim'>time</td><td>" + fmt(S.pts[sel]) + "</td></tr>" +
    "<tr><td class='dim'>frame</td><td>#" + sel + (onRow ? "" : " <span class='dim'>(between scanned frames; scored row #" + S.rows[r] + ")</span>") + "</td></tr>" +
    "<tr><td class='dim'>human label</td><td>" + (marked ? "<span class='star'>★ meme</span>" : notMarked ? "<span class='no'>✗ not a meme</span>" : (rowMarked[r] || rowNot[r] ? "near a mark" : "unlabeled")) + "</td></tr>" +
    "<tr><td class='dim'>classifier</td><td>" + (S.verdict[r] ? "<span class='flag'>⚑ flagged</span>" : "not flagged") + "</td></tr>";
  for (const c of S.criteria)
    html += "<tr><td class='dim'>" + c.name + "</td><td>" + S.scores[c.name][r] +
            (c.threshold != null ? " <span class='dim'>(threshold " + c.threshold + ")</span>" : "") + "</td></tr>";
  $("facts").innerHTML = html;
  renderChips();
}

async function setMark(frame, on, label = "meme") {
  try {
    applyLabels(await api("/api/mark", {frame, on, label}));
    refilter();           // a row that stops matching drops out after the change
    renderInfo();
  } catch (e) { $("err").textContent = String(e); }
}

async function toggleLabel(label) {
  if (!hasSel && multi.size <= 1) return;           // nothing is selected
  const rowFlag = label === "meme" ? rowMarked : rowNot;
  const frameSet = label === "meme" ? memeFrames : notFrames;
  const list = label === "meme" ? S.memes : S.not_memes;
  if (multi.size > 1) {                                // one request for the whole selection
    const rows = Array.from(multi);
    const allSet = rows.every(r => rowFlag[r]);
    const frames = allSet
      ? list.filter(m => multi.has(rowOf(m.frame))).map(m => m.frame)
      : rows.filter(r => !rowFlag[r]).map(r => S.rows[r]);
    try {
      applyLabels(await api("/api/mark_many", {frames, on: !allSet, label}));
      multi = new Set();
      refilter(); renderInfo();
    } catch (e) { $("err").textContent = String(e); }
    return;
  }
  return setMark(sel, !frameSet.has(sel), label);
}
const toggleMark = () => toggleLabel("meme");

// Shift+M: the same meme was marked on another frame; move that mark here instead of adding one.
async function moveNearestMark() {
  if (!hasSel) return;
  const here = S.pts[sel];
  const near = S.memes.filter(m => m.frame !== sel && Math.abs(m.ts - here) <= S.window)
                      .sort((a, b) => Math.abs(a.ts - here) - Math.abs(b.ts - here))[0];
  if (!near) { $("err").textContent = "no mark within " + S.window + " s to move"; return; }
  try {
    applyLabels(await api("/api/move", {from: near.frame, to: sel}));
    refilter(); renderInfo();
  } catch (e) { $("err").textContent = String(e); }
}

function jumpMark(dir) {
  const sorted = S.memes.map(m => m.frame);
  const next = dir > 0 ? sorted.find(f => f > sel) : [...sorted].reverse().find(f => f < sel);
  if (next !== undefined) select(next);
}

function jumpUnlabeled() {
  const near = ts => S.memes.some(m => Math.abs(m.ts - ts) <= S.window);
  for (let r = rowOf(sel) + 1; r < S.rows.length; r++)
    if (!near(S.pts[S.rows[r]])) return select(S.rows[r]);
}

function jumpInView(dir) {
  const cur = rowOf(sel);
  const r = dir > 0 ? view.find(v => v > cur) : [...view].reverse().find(v => v < cur);
  if (r !== undefined) select(S.rows[r]);
}

function parseTime(text) {
  const parts = text.trim().split(":").map(Number);
  if (parts.some(isNaN)) return null;
  return parts.reduce((acc, p) => acc * 60 + p, 0);
}

function gotoTime(t) {
  let lo = 0, hi = S.pts.length - 1;       // first frame whose time is >= t
  while (lo < hi) { const mid = (lo + hi) >> 1; if (S.pts[mid] < t) lo = mid + 1; else hi = mid; }
  select(lo);
}

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") {
    if (e.target.id === "goto" && e.key === "Enter") {
      const t = parseTime(e.target.value);
      if (t !== null) { gotoTime(t); e.target.blur(); }
    }
    return;
  }
  const big = e.shiftKey ? Math.round(S.native_fps) : 1;
  switch (e.key) {
    case "Escape": deselectAll(); break;
    case "ArrowLeft": select(sel - big); break;
    case "ArrowRight": select(sel + big); break;
    case "ArrowUp": jumpInView(-1); break;
    case "ArrowDown": jumpInView(1); break;
    case "m": case "M": case " ": (e.shiftKey && e.key === "M" ? moveNearestMark() : toggleMark()); break;
    case "x": case "X": toggleLabel("not_meme"); break;
    case "n": case "N": jumpMark(1); break;
    case "p": case "P": jumpMark(-1); break;
    case "u": case "U": jumpUnlabeled(); break;
    case "j": case "J": jumpInView(1); break;
    case "k": case "K": jumpInView(-1); break;
    case "g": case "G": $("goto").focus(); break;
    default: return;
  }
  e.preventDefault();
});

function buildFilterInputs() {
  const box = $("f-criteria");
  for (const c of S.criteria) {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = "<label>" + c.name + "</label><input type='number' step='any' id='min-" + c.name +
                    "' placeholder='min'><input type='number' step='any' id='max-" + c.name + "' placeholder='max'>";
    box.appendChild(row);
  }
  for (const el of document.querySelectorAll("#filters select, #filters input")) el.onchange = refilter;
  $("fp").onclick = () => { resetFilters(); $("f-verdict").value = "1"; $("f-human").value = "other"; refilter(); };
  $("miss").onclick = () => { resetFilters(); $("f-verdict").value = "0"; $("f-human").value = "meme"; refilter(); };
  $("reset").onclick = () => { resetFilters(); refilter(); };
}

function resetFilters() {
  for (const el of document.querySelectorAll("#filters select, #filters input")) el.value = "";
}

$("toggle").onclick = toggleMark;
$("toggle-not").onclick = () => toggleLabel("not_meme");
$("strip").addEventListener("scroll", renderStrip);
window.addEventListener("resize", renderStrip);

// ---- opening a video -------------------------------------------------------------------------
let polling = false;
let looked = null;           // the video the modal is showing: {id, formats, dataset, ...}

function showOpener(canCancel) {
  $("src-close").hidden = !canCancel;
  $("opener").hidden = false;
  $("src").focus();
}

const mb = n => n ? (n / 1048576).toFixed(1) + " MB" : "size unknown";
const dur = t => t ? Math.floor(t / 3600) + ":" + String(Math.floor(t % 3600 / 60)).padStart(2, "0") + ":" + String(Math.floor(t % 60)).padStart(2, "0") : "";

function renderStatus(st) {
  const vid = $("vid");
  if (st.video) {
    const link = document.createElement("a");
    link.href = "https://www.youtube.com/watch?v=" + encodeURIComponent(st.video);
    link.target = "_blank"; link.rel = "noopener noreferrer";
    link.textContent = st.video; link.title = "Open on YouTube";
    vid.replaceChildren(link);
  } else vid.textContent = "no video";
  const pick = $("vid-select");
  $("ds-row").hidden = !st.datasets.length;
  pick.replaceChildren(new Option("Processed videos (" + st.datasets.length + ") — pick one to look it up…", ""),
    ...st.datasets.map(d => new Option(d.id + (d.id === st.video ? "  ✓ open" : "") + " — " + d.memes +
                                       " memes · " + d.not_memes + " not memes", d.id)));
  pick.value = "";
  const loading = st.state === "loading";
  $("open-msg").textContent = st.message || "";
  $("open-msg").style.color = st.state === "error" ? "var(--flag)" : "";
  const bar = $("open-bar");
  bar.hidden = !loading;
  if (loading) { st.progress == null ? bar.removeAttribute("value") : (bar.value = st.progress); }
  $("src-go").disabled = loading; $("load").disabled = loading;
  if (loading && st.progress != null) $("open-msg").textContent += " " + Math.round(st.progress * 100) + "%";
}

async function lookup(source) {
  source = source.trim();
  if (!source) return;
  $("lookup-msg").textContent = "Looking up…"; $("lookup-msg").style.color = ""; $("card").hidden = true;
  try {
    looked = await api("/api/inspect", {source});
  } catch (e) { $("lookup-msg").textContent = String(e); $("lookup-msg").style.color = "var(--flag)"; return; }
  $("lookup-msg").textContent = "";
  $("th").src = looked.thumbnail || "";
  $("ti").textContent = looked.title || looked.id;
  const date = looked.upload_date ? looked.upload_date.replace(/(\d{4})(\d\d)(\d\d)/, "$1-$2-$3") : "";
  $("meta").textContent = [looked.uploader, dur(looked.duration), date,
                           looked.view_count != null ? looked.view_count.toLocaleString() + " views" : "", looked.id]
                          .filter(Boolean).join(" · ");
  const pinned = looked.dataset ? looked.dataset.format_id : null;
  $("dsnote").innerHTML = pinned
    ? "<span class='warn'>Has a dataset (" + looked.dataset.memes + " memes, " + looked.dataset.not_memes +
      " not memes) in format " + pinned + "; it can only be loaded in that format.</span>" : "";
  const chosen = pinned || looked.preselected;
  $("fmt-list").replaceChildren(...looked.formats.map(f => {
    const label = document.createElement("label");
    const off = pinned && f.format_id !== pinned;
    label.className = off ? "off" : "";
    label.innerHTML = "<input type='radio' name='fmt' value='" + f.format_id + "'" +
      (f.format_id === chosen ? " checked" : "") + (off ? " disabled" : "") + "> " +
      "<span>" + f.height + "p</span><span class='dim'>" + (f.fps ? f.fps + " fps · " : "") + f.ext + " · " +
      (f.vcodec || "").split(".")[0] + " · " + mb(f.size) + " · id " + f.format_id + "</span>" +
      (f.av1 ? "<span class='warn'>AV1: may not decode here</span>" : "");
    return label;
  }));
  if (pinned && !looked.formats.some(f => f.format_id === pinned)) {
    const note = document.createElement("div");
    note.className = "warn"; note.style.padding = "4px 8px";
    note.textContent = "The dataset's format " + pinned + " is no longer offered; the downloaded file is used if present.";
    $("fmt-list").prepend(note);
  }
  $("card").hidden = false;
}

async function poll() {
  if (polling) return;
  polling = true;
  try {
    for (;;) {
      const st = await api("/api/status");
      renderStatus(st);
      if (st.state === "ready") { location.reload(); return; }
      if (st.state !== "loading") return;
      await new Promise(r => setTimeout(r, 700));
    }
  } finally { polling = false; }
}

async function loadSelected() {
  if (!looked) return;
  const picked = document.querySelector("#fmt-list input:checked");
  const format_id = looked.dataset ? null : (picked ? picked.value : null);   // a dataset pins its own
  try {
    await api("/api/open", {source: looked.id, format_id});
  } catch (e) { $("open-msg").textContent = String(e); $("open-msg").style.color = "var(--flag)"; return; }
  poll();
}

$("vid-select").onchange = e => {
  const id = e.target.value;
  e.target.blur();                                  // so the arrow keys step frames again
  if (!id) return;
  $("src").value = id;
  lookup(id);                                       // shows its details and recorded format; then Load
};
$("open-btn").onclick = () => showOpener(true);
$("src-close").onclick = () => { $("opener").hidden = true; };
$("src-go").onclick = () => lookup($("src").value);
$("load").onclick = loadSelected;
$("src").addEventListener("keydown", e => { if (e.key === "Enter") lookup($("src").value); e.stopPropagation(); });

(async () => {
  const st = await api("/api/status");
  renderStatus(st);
  if (st.state === "loading") { showOpener(!!st.video); poll(); }
  if (!st.video) { if (st.state !== "loading") showOpener(false); return; }
  S = await api("/api/state");
  document.title = "Labeler — " + S.video.id;
  buildFilterInputs();
  applyLabels(S);
  refilter();
  select(S.memes.length ? S.memes[0].frame : 0);
})().catch(e => { $("err").textContent = String(e); });
</script>
</body>
</html>
